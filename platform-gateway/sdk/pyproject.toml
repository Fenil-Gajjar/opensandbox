[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "isolake"
version = "0.1.0"
description = "Python SDK for the Isolake sandbox platform"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.4.2,<3.0",
    "python-dateutil>=2.8.2,<3.0",
    "attrs>=21.3.0",
    "httpx>=0.27.0,<1.0",
]

[project.optional-dependencies]
pool-redis = [
    "redis>=5.0,<6.0",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["isolake*"]
