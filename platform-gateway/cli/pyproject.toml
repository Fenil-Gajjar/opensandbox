[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "isolake-cli"
version = "0.1.0"
description = "CLI for the Isolake sandbox platform"
requires-python = ">=3.11"
dependencies = [
    "isolake>=0.1.0",
    "click>=8.0",
    "rich>=13.0",
    "pydantic>=2.0",
    "httpx>=0.27.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
isolake = "isolake_cli.main:cli"

[tool.setuptools.packages.find]
where = ["src"]
include = ["isolake_cli*"]
