[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "isolake-mcp"
version = "0.1.0"
description = "Isolake MCP Sandbox Server"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]",
    "isolake>=0.1.0",
]

[project.scripts]
isolake-mcp = "isolake_mcp.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["isolake_mcp*"]
